<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kyiv Weather & USD/UAH Dashboard</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="dashboard" aria-live="polite">
      <header class="page-header" aria-label="Dashboard header">
        <h1>Kyiv Weather · USD/UAH</h1>
        <p id="updatedAt" aria-live="polite">Updated: --</p>
      </header>

      <section class="panel panel-weather" aria-labelledby="weather-title">
        <div class="panel-header">
          <h2 id="weather-title">Weather in Kyiv</h2>
          <p id="weatherStatus" class="panel-status">Loading...</p>
        </div>
        <div class="weather-grid">
          <p class="primary-figure" id="weatherTemp">-- °C</p>
          <div class="metric">
            <p class="metric-label">Condition</p>
            <p class="metric-value" id="weatherCondition">--</p>
          </div>
          <div class="metric">
            <p class="metric-label">Humidity</p>
            <p class="metric-value" id="weatherHumidity">-- %</p>
          </div>
          <div class="metric">
            <p class="metric-label">Wind</p>
            <p class="metric-value" id="weatherWind">-- m/s</p>
          </div>
        </div>
        <p class="error-message" id="weatherError" hidden>Unable to load weather data.</p>
      </section>

      <section class="panel panel-fx" aria-labelledby="fx-title">
        <div class="panel-header">
          <h2 id="fx-title">USD → UAH rate (30 days)</h2>
          <p id="fxStatus" class="panel-status">Loading...</p>
        </div>
        <div class="fx-body">
          <div class="fx-meta">
            <div>
              <p class="metric-label">Today's rate</p>
              <p class="metric-value" id="fxToday">--</p>
            </div>
            <div>
              <p class="metric-label">30d min</p>
              <p class="metric-value" id="fxMin">--</p>
            </div>
            <div>
              <p class="metric-label">30d max</p>
              <p class="metric-value" id="fxMax">--</p>
            </div>
          </div>
          <div class="chart-wrapper">
            <canvas
              id="fxChart"
              width="720"
              height="220"
              role="img"
              aria-label="USD to UAH rates for the last 30 days"
            ></canvas>
          </div>
        </div>
        <p class="error-message" id="fxError" hidden>Unable to load exchange rate data.</p>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
